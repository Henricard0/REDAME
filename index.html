<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REDAME: O Resgate do Legado</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Aventura em pixel art: viaje no tempo com o Revisor de Épocas e resgate a história de 15 engenheiras pioneiras.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<style>
  /* Layout: a tela do jogo (320x180, pixels inteiros) centralizada sobre o ceu noturno do Revisor; controles de toque abaixo (retrato) ou por cima (paisagem). */
  :root {
    --noite: #0d0b1c;
    --painel: #1c1838;
    --borda: #3b3366;
    --texto: #f4ecd8;
    --latao: #ffd98a;
    --holograma: #7fe3f0;
    --fonte-pixel: "Pixelify Sans", ui-monospace, "Cascadia Mono", "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    background: var(--noite);
    color: var(--texto);
    font-family: var(--fonte-pixel);
    margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
    box-sizing: border-box;
    display: grid;
    grid-template-rows: 1fr auto;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #area-jogo {
    position: relative;
    min-height: 0;
    min-width: 0;
    display: grid;
    place-items: center;
    padding-block: 8px;
  }
  #tela {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #0c0a12;
    box-shadow: 0 0 0 2px var(--borda), 0 12px 40px rgb(0 0 0 / 0.55);
    touch-action: none;
    max-width: 100%;
  }
  #carregando {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 12px;
    text-align: center;
    font-size: 1.1rem;
    letter-spacing: 0.04em;
  }
  #carregando .trilho { width: min(240px, 60vw); height: 8px; border: 2px solid var(--latao); padding: 1px; }
  #carregando-barra { height: 100%; width: 0; background: var(--holograma); transition: width 0.15s; }
  #controles {
    display: none;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding-block: 8px max(12px, env(safe-area-inset-bottom, 0px));
    touch-action: none;
  }
  @media (pointer: coarse) {
    #controles { display: flex; }
  }
  @media (pointer: coarse) and (orientation: portrait) {
    #area-jogo { place-items: start center; padding-block: 24px 8px; }
  }
  @media (pointer: coarse) and (orientation: landscape) {
    body { grid-template-rows: 1fr; }
    #controles {
      position: fixed;
      left: max(12px, env(safe-area-inset-left, 0px));
      right: max(12px, env(safe-area-inset-right, 0px));
      bottom: max(10px, env(safe-area-inset-bottom, 0px));
      padding: 0;
      pointer-events: none;
      opacity: 0.72;
    }
    #controles > * { pointer-events: auto; }
  }
  .dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); }
  .botao {
    appearance: none;
    border: 2px solid var(--borda);
    background: var(--painel);
    color: var(--texto);
    font: 600 1.05rem var(--fonte-pixel);
    display: grid;
    place-items: center;
    padding: 0;
    touch-action: none;
    cursor: pointer;
  }
  .botao svg { width: 20px; height: 20px; fill: var(--latao); }
  .botao.ativo, .botao:active { background: var(--borda); border-color: var(--holograma); }
  .botao:focus-visible { outline: 2px solid var(--holograma); outline-offset: 2px; }
  .dpad .cima { grid-area: 1 / 2; border-radius: 8px 8px 0 0; }
  .dpad .esq { grid-area: 2 / 1; border-radius: 8px 0 0 8px; }
  .dpad .dir { grid-area: 2 / 3; border-radius: 0 8px 8px 0; }
  .dpad .baixo { grid-area: 3 / 2; border-radius: 0 0 8px 8px; }
  .dpad .meio { grid-area: 2 / 2; background: var(--painel); border: 2px solid var(--borda); }
  .acoes { display: grid; grid-template-columns: 64px 64px; grid-template-rows: 40px 64px; gap: 10px; align-items: end; }
  .acoes .menu { grid-column: 1 / 3; justify-self: end; width: 64px; height: 36px; border-radius: 18px; font-size: 0.85rem; }
  .acoes .redondo { width: 64px; height: 64px; border-radius: 50%; font-size: 1.4rem; }
  .acoes .a { color: var(--holograma); border-color: var(--holograma); transform: translateY(-14px); }
  .acoes .b { color: var(--latao); }
  @media (prefers-reduced-motion: reduce) {
    #carregando-barra { transition: none; }
  }
</style>
</head>
<body>
<main id="area-jogo">
  <canvas id="tela" width="320" height="180" aria-label="Tela do jogo REDAME"></canvas>
  <div id="carregando" role="status">
    <span>Abrindo o Revisor de Épocas…</span>
    <div class="trilho"><div id="carregando-barra"></div></div>
  </div>
</main>
<nav id="controles" aria-label="Controles de toque">
  <div class="dpad">
    <button class="botao cima" data-acao="cima" aria-label="Para cima"><svg viewBox="0 0 10 10"><path d="M5 2 9 8H1z"/></svg></button>
    <button class="botao esq" data-acao="esq" aria-label="Para a esquerda"><svg viewBox="0 0 10 10"><path d="M2 5 8 1v8z"/></svg></button>
    <span class="meio"></span>
    <button class="botao dir" data-acao="dir" aria-label="Para a direita"><svg viewBox="0 0 10 10"><path d="M8 5 2 9V1z"/></svg></button>
    <button class="botao baixo" data-acao="baixo" aria-label="Para baixo"><svg viewBox="0 0 10 10"><path d="M5 8 1 2h8z"/></svg></button>
  </div>
  <div class="acoes">
    <button class="botao menu" data-acao="menu">Menu</button>
    <button class="botao redondo b" data-acao="voltar" aria-label="Voltar ou correr">B</button>
    <button class="botao redondo a" data-acao="acao" aria-label="Agir">A</button>
  </div>
</nav>
<script src="jogo.js"></script>
</body>
</html>
